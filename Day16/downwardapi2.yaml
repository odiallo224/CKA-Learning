---
apiVersion: v1
kind: Pod
metadata:
  name: downwardapi-volume
  labels:
    app: new-hires
    owner: hr
  annotations:
    version: "Stable Version"
spec:
  containers:
    - name: busybox1
      image: busybox
      command: ["sh", "-c", "cat /etc/podinfo/* && sleep 3600"]
      volumeMounts:
      - name: downwardapi-volume
        mountPath: /etc/podinfo   
  volumes:
    - name: downwardapi-volume
      downwardAPI:
        items:
        - path: "labels"
          fieldRef:
            fieldPath: metadata.labels
        - path: "annotations"
          fieldRef:
            fieldPath: metadata.annotations
