---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: my-role
  namespace: dev-uat
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - list
  - delete
  - get  
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - list
  - delete
  - get  

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-my-role
  namespace: dev-uat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: my-role
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: marco
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: junior-devops
