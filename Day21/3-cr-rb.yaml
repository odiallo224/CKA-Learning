---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: my-cr1
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - update
  - get
  - list  
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - update
  - patch
  - get
  - list  

---    
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-my-cr1 
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: my-cr1
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: marco
