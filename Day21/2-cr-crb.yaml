---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: my-crole
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - list
  - get
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - list
  - get
  - watch

---    
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-my-crole
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: my-crole
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: marco
