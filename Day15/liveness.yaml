---
apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe
  labels:
    test: liveness
spec:
  containers:
    - name: liveness-app
      image: registry.k8s.io/e2e-test-images/agnhost:2.40
      args:
        - liveness  
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
          httpHeaders:
            - name: Custom-Header
              value: Awespme
        initialDelaySeconds: 3
        periodSeconds: 3  
