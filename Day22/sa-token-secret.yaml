apiVersion: v1
kind: Secret
metadata:
  name: jenkins-service-account-token
  namespace: jenkins-ns
  annotations:
    kubernetes.io/service-account.name: jenkins-sa  
type: kubernetes.io/service-account-token

 # Use the command bellow to check if sa-token was successfuly set
 # curl -H "Authorization: Bearer <TOKEN>" https://<api-server-url>/api/v1/namespaces/jenkins-ns/pods -k  
