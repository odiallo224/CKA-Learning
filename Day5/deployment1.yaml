apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  annotations:
    kubernetes.io/change-cause: "Initial Release with nginx 1.19"  
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
      environment: staging  
  template:
    metadata:
      labels:
        app: nginx
        environment: staging
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.19      
