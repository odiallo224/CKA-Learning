---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
     containers:
       - name: nginx-secret1
         image: nginx
         env:
           - name: DB_USER
             valueFrom:
               secretKeyRef:
                 name: secret-1
                 key: DB_USER
           - name: DB_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: secret-1
                 key: DB_PASSWORD          
