---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx-env
        image: nginx
        env:
        - name: APP
          value: backend      #NOTE: If you change the env variable and reaply the yaml then k8s will do a rolling update, which will results in creating new pod. 
        - name: ENVIRONMENT
          value: production      
