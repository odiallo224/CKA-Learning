---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-volume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx-vol
          image: nginx
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: secret-1
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-1
                  key: DB_PASSWORD
          volumeMounts:
            - name: secret-vol
              mountPath: /etc/secrets
              readOnly: true          
      volumes:
        - name: secret-vol
          secret:
           secretName: secret-1
