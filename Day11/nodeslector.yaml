apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeselector-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      nodeSelector:
        storage: ssd
        env: prod  
      containers:
        - name: nginx-container
          image: nginx      
