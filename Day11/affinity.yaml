apiVersion: apps/v1
kind: Deployment
metadata:
  name: na-deploy
spec:
  replicas: 12
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: storage
                  operator: In
                  values:
                    - ssd
                    - hdd  
      containers:
        - name: nginx-container
          image: nginx         

              
