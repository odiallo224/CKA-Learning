apiVersion: v1
kind: Pod
metadata:
  name: init-pod
spec:
  initContainers:
    - name: init-app
      image: curlimages/curl:latest 
      command: ["sh", "-c", "echo 'Checking API availability...'; sleep 20; until curl -s https://kubernetes.io > /dev/null; do echo 'Waiting for API...'; sleep 5; done; echo 'API is accessible, proceeding to main-app container!'"]
  containers:
    - name: main-app
      image: nginx:latest
      ports:
      - containerPort: 80    
