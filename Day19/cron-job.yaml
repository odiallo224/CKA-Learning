---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-job
  namespace: loggin-ns
  labels:
    app: run-on-schedule
spec:
  schedule: "*/1 * * * *"   #Runs every minute  
  jobTemplate:
    spec:
      #ttlSecondsAfterFinished: 30
      completions: 2
      parallelism: 2
      backoffLimit: 4
      template:
        spec:
          containers:
            - name: hello
              image: busybox
              command: ["sh", "-c", "echo Hello World from K8s Cron Job...! && sleep 10"]
          restartPolicy: Never      
