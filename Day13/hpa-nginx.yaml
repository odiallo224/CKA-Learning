---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: hpa-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx-hpa
          image: nginx
          resources:
            requests:
              cpu: "25m"
            limits:
              cpu: "50m"    
          ports:
          - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  selector:
    app: nginx
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80   


