apiVersion: v1
kind: Pod
metadata:
  name: cpu-load
spec:
  containers:
    - name: cpu-container
      image: vish/stress
      resources:
        requests:
          cpu: "500m"   # Minimum required CPU 500m=1/2CPU
        limits:
          cpu: "900m"
      args:
        - -cpus
        - "1"            #This tells the container to use 1CPU
