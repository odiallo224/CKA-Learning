apiVersion: v1
kind: Pod
metadata:
  name: stress-demo2
spec:
  containers:
    - name: memory-demo
      image: polinux/stress   #This image allows us to do memory load test       
      resources:
        requests:
          memory: "100Mi"
        limits:
          memory: "200Mi"
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]     # Argument needed to do the load test 
