---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-pod
  labels:
    storage: pvc
spec:
  containers:
    - name: nginx-container
      image: nginx
      volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: storage-vol
  volumes:
    - name: storage-vol
      persistentVolumeClaim:
        claimName: pvc-example    
