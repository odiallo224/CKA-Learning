apiVersion: apps/v1
kind: Deployment
metadata: 
  name: taint-toleration
spec:
  replicas: 5
  selector:
    matchLabels:
      app: toleration
  template:
    metadata:
      labels:
        app: toleration
    spec:
      containers:
      - name: taint-pod1
        image: nginx
        ports:
          - containerPort: 80
      tolerations:
        - key: storage
          operator: Equal
          value: ssd
          effect: NoSchedule        
